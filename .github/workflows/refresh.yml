name: Refresh archive

on:
  schedule:
    - cron: "0 18 * * 0"   # Sundays 18:00 UTC — 04:00 Monday AEST
  workflow_dispatch:
    inputs:
      backfill_from:
        description: "Deep backfill start date (YYYY-MM-DD). Leave blank for the weekly top-up."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: archive-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install requests

      # A backfill walks contractPublished, which reaches back years. The weekly
      # run walks contractLastModified, which only covers roughly two years but
      # is what surfaces amendments to older contracts.
      # A backfill is committed and pushed after every chunk. The first attempt
      # fetched for three hours, then lost the lot to a single rejected push
      # because main had moved on underneath it. Now the most a failure can cost
      # is one chunk, and progress is visible in the commit log as it happens.
      - name: Build archive
        env:
          AUSTENDER_TOKEN: ${{ secrets.AUSTENDER_TOKEN }}
          BACKFILL_FROM: ${{ github.event.inputs.backfill_from }}
        run: |
          set -euo pipefail
          git config user.name "legal-tender-bot"
          git config user.email "legal-tender-bot@users.noreply.github.com"

          # refresh.py rebuilds every shard from what it reads on disk, so a
          # stale checkout silently drops rows another writer had added. Sync
          # BEFORE building, not only before pushing.
          sync () {
            git pull --rebase --autostash origin main || {
              echo "rebase failed; aborting rather than committing a conflict" >&2
              git rebase --abort 2>/dev/null || true
              return 1
            }
            if grep -rlq '^<<<<<<< ' data 2>/dev/null; then
              echo "conflict markers present in data/ after sync" >&2
              return 1
            fi
          }

          save () {
            # Always rebase onto whatever landed while we were fetching, or the
            # push is rejected and the work is thrown away.
            # Never commit a file containing conflict markers. Five corrupted
            # files reached main this way and took the site down.
            if grep -rlq '^<<<<<<< ' data 2>/dev/null; then
              echo "refusing to commit: conflict markers in data/" >&2
              grep -rl '^<<<<<<< ' data >&2
              return 1
            fi
            git add data
            if git diff --staged --quiet; then echo "nothing to commit"; return 0; fi
            git commit -m "$1"
            for attempt in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push && return 0
              echo "push attempt $attempt failed; retrying"
              sleep $((attempt * 15))
            done
            echo "could not push after 5 attempts" >&2
            return 1
          }

          more_to_do () {
            python - <<'PY'
          import json, sys
          try:
              b = json.load(open("data/index.json")).get("backfill") or {}
          except Exception:
              b = {}
          sys.exit(0 if b.get("next") else 1)
          PY
          }

          if [ -n "${BACKFILL_FROM:-}" ]; then
            sync
            python refresh.py --backfill-from "$BACKFILL_FROM" --chunk-days 180
            save "Backfill chunk $(date -u +%F\ %H:%M)"
            for i in $(seq 1 40); do
              more_to_do || break
              sync
              python refresh.py --resume --chunk-days 180
              save "Backfill chunk $(date -u +%F\ %H:%M)"
            done
            echo "backfill loop finished"
          else
            sync
            python refresh.py --since-days 21
            save "Archive refresh $(date -u +%F)"
          fi
