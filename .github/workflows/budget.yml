name: Portfolio Budget Statements

# The only forward-looking source here. Everything else in this archive is
# retrospective — a contract notice exists once money is committed — while the
# budget statements record what an agency has been given, by programme, three
# years out. Published as CSV on data.gov.au, the same API the historical
# contract extracts come from, so no scraping and it runs here.
#
# Appropriations are not contracts. They are never added to contract totals,
# and the site says so wherever they appear.
on:
  schedule:
    - cron: "0 20 10 * *"   # the 10th monthly; budgets move in March and May
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Refuse to run alongside another archive writer
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          busy=0
          for wf in refresh.yml backfill-resume.yml senate.yml so13.yml historical.yml atm.yml export.yml graph.yml nsw.yml son.yml budget.yml; do
            [ "$wf" = "budget.yml" ] && continue
            n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf" \
                  --status in_progress --json databaseId --jq 'length' 2>/dev/null || echo 0)
            busy=$((busy + n))
          done
          echo "other archive writers in flight: $busy"
          [ "$busy" -gt 0 ] && echo "skip=true" >> $GITHUB_OUTPUT || echo "skip=false" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v5
        if: steps.guard.outputs.skip != 'true'
      - uses: actions/setup-python@v6
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - run: pip install requests
        if: steps.guard.outputs.skip != 'true'

      - name: Read the budget statements
        if: steps.guard.outputs.skip != 'true'
        run: python budget.py --out data/budget/programs.json

      - name: Commit
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "legal-tender-bot"
          git config user.email "legal-tender-bot@users.noreply.github.com"
          git pull --rebase --autostash origin main || { git rebase --abort 2>/dev/null || true; }
          if grep -rlq '^<<<<<<< ' data 2>/dev/null; then
            echo 'refusing to commit: conflict markers in data/' >&2; exit 1
          fi
          git add data/budget
          if ! git diff --staged --quiet; then
            git commit -m "Portfolio Budget Statements $(date -u +%F)"
            git push origin main
          else
            echo "nothing new"
          fi
