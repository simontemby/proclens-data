name: NSW contract awards

# The register publishes its own bulk export, public and without a sign-in:
# buy.nsw.gov.au/notices/notice-reports, filtered by notice type, agency,
# category and publish date, with an Export CSV button. This asks for it the way
# the button does, with the same fields and no token.
#
# It was done by hand for a long time on the belief that the register answered
# nothing but a browser. It answers an ordinary client perfectly well; what it
# will not take is haste. Asking about ten times in quick succession turns the
# answers into empty 202 challenges on every path. So this runs twice a week and
# makes two requests when it does, five seconds apart, and nothing is written
# unless what came back is a CSV with rows under the register's own header.
#
# Exports dropped into data/nsw/raw/ by hand are still read, and still trigger
# a run.
on:
  schedule:
    - cron: "0 19 * * 1,4"   # Tuesday and Friday, 06:00 AEDT
  push:
    paths:
      - "data/nsw/raw/**"
      - "nsw.py"
  workflow_dispatch:
    inputs:
      full:
        description: "Ask for the whole history rather than the rolling window"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: archive-write
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.actor != 'legal-tender-bot'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests

      # A scheduled run takes the export first. A run triggered by a push to
      # data/nsw/raw/ reads what the push put there and asks for nothing.
      - name: Take the exports and parse them
        if: github.event_name != 'push'
        run: python nsw.py --raw data/nsw/raw --out data/nsw --fetch
             ${{ inputs.full && '--full' || '' }}

      - name: Parse the exports already here
        if: github.event_name == 'push'
        run: python nsw.py --raw data/nsw/raw --out data/nsw

      # The stores this job writes are read straight by the site, so they are
      # asserted before anything is committed: a store that has lost most of its
      # rows has broken rather than shrunk, and an amount below the floor its
      # own source sets is a denomination misread, not a cheap contract.
      - name: Assert what must be true
        run: python check.py
      - name: Say how fresh it is
        run: |
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json, datetime
          d = json.load(open("data/nsw/index.json"))
          t = d["totals"]
          latest = t.get("newest_published")
          kinds = ", ".join(f"{n:,} {k.lower()}s" for k, n in (t.get("by_kind") or {}).items())
          line = f"**{t['contracts']:,} NSW notices** ({kinds})."
          if latest:
              days = (datetime.date.today() - datetime.date.fromisoformat(latest)).days
              line += f" Newest published {latest} — {days} days ago."
              if days > 45:
                  line += ("\n\n> The register has moved on since these exports and this job "
                           "is no longer keeping up with it. Check whether the export is "
                           "being refused — `python tools/reachability.py` says so in the "
                           "register's own words — and if it is, take one by hand from "
                           "https://buy.nsw.gov.au/notices/notice-reports and add it to "
                           "`data/nsw/raw/` as `can-<range>.csv`.")
          print(line)
          PY

      - name: Commit
        run: |
          git config user.name "legal-tender-bot"
          git config user.email "legal-tender-bot@users.noreply.github.com"
          git pull --rebase --autostash origin main || { git rebase --abort 2>/dev/null || true; }
          if grep -rlq '^<<<<<<< ' data 2>/dev/null; then
            echo 'refusing to commit: conflict markers in data/' >&2; exit 1
          fi
          git add data/nsw
          if ! git diff --staged --quiet; then
            git commit -m "NSW contract awards $(date -u +%F)"
            git push origin main
          else
            echo "nothing new"
          fi
