name: Approaches to market

# AusTender publishes the current ATM list as 75 RSS items and keeps no archive,
# so a notice that opens and closes between two polls is lost for good.
#
# Wednesday and Friday nights, Canberra time. Approaches usually stay open for
# weeks, so twice a week catches almost everything — but the feed holds only 75
# notices, and a busy stretch can turn over faster than that. Anything that opens
# and closes inside one gap is gone permanently, which three runs a day made
# nearly impossible and this schedule does not.
on:
  schedule:
    - cron: "30 11 * * 3,5"   # 21:30 AEST / 22:30 AEDT, Wednesday and Friday
  workflow_dispatch:
    inputs:
      refresh_detail:
        description: "Re-fetch the detail page for every notice"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: archive-write
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # Any workflow that writes data/ must not run beside another writer, and
      # must never commit a half-merged file. Two unguarded writers overlapping
      # put conflict markers into main and took the site down.
      - name: Refuse to run alongside another archive writer
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          busy=0
          for wf in refresh.yml backfill-resume.yml senate.yml so13.yml historical.yml atm.yml export.yml graph.yml; do
            [ "$wf" = "atm.yml" ] && continue
            n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf" \
                  --status in_progress --json databaseId --jq 'length' 2>/dev/null || echo 0)
            busy=$((busy + n))
          done
          echo "other archive writers in flight: $busy"
          [ "$busy" -gt 0 ] && echo "skip=true" >> $GITHUB_OUTPUT || echo "skip=false" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v5
        if: steps.guard.outputs.skip != 'true'
      - uses: actions/setup-python@v6
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - run: pip install requests
        if: steps.guard.outputs.skip != 'true'

      - name: Poll the notice feed
        if: steps.guard.outputs.skip != 'true'
        # Set the PROCLENS_SITE repository variable when the site moves hosts;
        # it is the address the Atom feed publishes as its own. Unset falls back
        # to the GitHub Pages URL.
        env:
          PROCLENS_SITE: ${{ vars.PROCLENS_SITE }}
        run: |
          python atm.py --out data/atm --watchlist data/watchlist.json \
            ${{ inputs.refresh_detail && '--refresh-detail' || '' }}

      - name: Commit notices and alerts
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "legal-tender-bot"
          git config user.email "legal-tender-bot@users.noreply.github.com"
          git pull --rebase --autostash origin main || { git rebase --abort 2>/dev/null || true; }
          if grep -rlq '^<<<<<<< ' data 2>/dev/null; then
            echo 'refusing to commit: conflict markers in data/' >&2; exit 1
          fi
          git add data/atm
          # index.json alone changes on every poll because it carries a
          # timestamp. Committing that three times a day for no news is noise,
          # so a run with nothing but the clock to report says nothing.
          if git diff --staged --name-only | grep -qv '^data/atm/index.json$'; then
            git commit -m "Approaches to market $(date -u +%F)"
            git push
          else
            git reset
            echo "no change beyond the timestamp — nothing committed"
          fi
