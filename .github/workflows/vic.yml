name: Victorian contracts

# Victoria publishes its own contract register at tenders.vic.gov.au — 57,000
# contracts back to 2003, none of it on AusTender.
#
# This CANNOT run on a schedule here, and the schedule has been removed rather
# than left to fail twice a week. The platform sits behind Cloudflare, which
# answers a GitHub runner with 403 and "Just a moment..." while serving an
# ordinary connection normally. Every test from a desk passed, which is why the
# workflow was written as though it would work. Getting past that interstitial
# is bot-detection bypass and this archive does not do it.
#
# So vic.py is run from a machine the platform will answer — a desk, or a
# self-hosted runner — and the result committed. The dispatch below stays
# because it costs nothing and will start working if Victoria stops
# challenging datacentre traffic; it reports what it was served either way.
#
# The pace is deliberate — one request every 1.5 seconds. At half a second the
# platform began refusing and the run stalled. This is a small state service.
on:
  workflow_dispatch:
    inputs:
      full:
        description: "Sweep every page of every buyer"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: archive-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Refuse to run alongside another archive writer
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          busy=0
          for wf in refresh.yml backfill-resume.yml senate.yml so13.yml historical.yml atm.yml export.yml graph.yml vic.yml; do
            [ "$wf" = "vic.yml" ] && continue
            n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf" \
                  --status in_progress --json databaseId --jq 'length' 2>/dev/null || echo 0)
            busy=$((busy + n))
          done
          echo "other archive writers in flight: $busy"
          [ "$busy" -gt 0 ] && echo "skip=true" >> $GITHUB_OUTPUT || echo "skip=false" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v5
        if: steps.guard.outputs.skip != 'true'
      - uses: actions/setup-python@v6
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - run: pip install requests
        if: steps.guard.outputs.skip != 'true'

      - name: Collect the register
        if: steps.guard.outputs.skip != 'true'
        run: |
          full=""
          if [ "${{ inputs.full }}" = "true" ]; then
            full="--full"
          fi
          python vic.py --out data/vic $full

      - name: Commit
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "legal-tender-bot"
          git config user.email "legal-tender-bot@users.noreply.github.com"
          git pull --rebase --autostash origin main || { git rebase --abort 2>/dev/null || true; }
          if grep -rlq '^<<<<<<< ' data 2>/dev/null; then
            echo 'refusing to commit: conflict markers in data/' >&2; exit 1
          fi
          # The partial checkpoint is working state, not archive.
          rm -f data/vic/collecting.partial
          git add data/vic
          if ! git diff --staged --quiet; then
            git commit -m "Victorian contracts $(date -u +%F)"
            git push origin main
          else
            echo "nothing new"
          fi
